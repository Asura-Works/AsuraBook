name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Runtime report
        run: uv run python -c "import sys, sqlite3, platform; print(sys.version); print('sqlite', sqlite3.sqlite_version); print(platform.platform())"
      - name: Tests (core)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rs -m "not gui" 2>&1 | tee pytest-core.txt
      - name: Tests (GUI offscreen)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rs -m gui -p no:cacheprovider 2>&1 | tee pytest-gui.txt
      - name: Verify Windows-only tests actually ran
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rs tests/test_cli_ipc.py -k "windows_named_pipe" 2>&1 | tee pytest-win.txt
          grep -q "1 passed" pytest-win.txt
          echo "::notice title=windows-only tests::$(tail -1 pytest-win.txt)"
      - name: Summaries as annotations
        if: always()
        shell: bash
        run: |
          for f in pytest-core.txt pytest-gui.txt; do
            [ -f "$f" ] && echo "::notice title=${{ runner.os }} $f::$(tail -1 $f)"
          done
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotate.py pytest-core.txt pytest-gui.txt pytest-win.txt
