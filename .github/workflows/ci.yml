name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Runtime report
        run: uv run python -c "import sys, sqlite3, platform; print(sys.version); print('sqlite', sqlite3.sqlite_version); print(platform.platform())"
      - name: Tests (core)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs -m "not gui" 2>&1 | tee pytest-core.txt
      - name: Tests (GUI offscreen)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs -m gui -p no:cacheprovider 2>&1 | tee pytest-gui.txt
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotate.py pytest-core.txt pytest-gui.txt
