[project]
name = "asurabook"
version = "0.1.0"
description = "AsuraBook: 個人事業者向けローカル会計・証憑・申告準備アプリ（詳細設計 1.0 に基づく実装）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23",
    # Windows には OS の IANA tz database がないため zoneinfo 用に必要
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.8",
]

[project.scripts]
asurabook = "asurabook.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gui: PySide6 offscreen の GUI 試験"]
