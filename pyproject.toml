[project]
name = "taxdesk"
version = "0.1.0"
description = "TaxDesk: 個人事業者向けローカル会計・証憑・申告準備アプリ（詳細設計 1.0 に基づく実装）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.8",
]

[project.scripts]
taxdesk = "taxdesk.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
